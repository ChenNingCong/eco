<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Cities</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --Blue: #2563eb;
    --Blue-light: #93c5fd;
    --Blue-dark: #1e3a8a;
    --Yellow: #d97706;
    --Yellow-light: #fde68a;
    --Yellow-dark: #78350f;
    --White: #94a3b8;
    --White-light: #e2e8f0;
    --White-dark: #334155;
    --Green: #16a34a;
    --Green-light: #86efac;
    --Green-dark: #14532d;
    --Red: #dc2626;
    --Red-light: #fca5a5;
    --Red-dark: #7f1d1d;
    /* light mode (default) */
    --bg: #f5f0eb;
    --surface: #ffffff;
    --surface2: #ede8e0;
    --surface-hover: #d9d0c4;
    --border: #d4c9b8;
    --text: #2c2418;
    --text-muted: #7a6a55;
    --gold: #a07828;
    --gold-light: #b8922e;
  }

  html.dark {
    --bg: #0c0a0e;
    --surface: #161220;
    --surface2: #1e1a2e;
    --surface-hover: #261f3a;
    --border: #2d2640;
    --text: #e8e0f0;
    --text-muted: #8b7fa8;
    --gold: #c9a84c;
    --gold-light: #f0d070;
  }

  #theme-toggle {
    position: absolute;
    top: 50%;
    right: 20px;
    transform: translateY(-50%);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    transition: border-color 0.2s;
  }
  #theme-toggle:hover { border-color: var(--gold); }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(220,38,38,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(22,163,74,0.05) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  header {
    text-align: center;
    padding: 24px 20px 16px;
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.12em;
    text-shadow: 0 0 30px rgba(201,168,76,0.4);
  }
  header p {
    color: var(--text-muted);
    font-style: italic;
    font-size: 1rem;
    margin-top: 2px;
  }

  /* ── Layout ── */
  .game-layout {
    display: grid;
    grid-template-columns: 1fr 240px 1fr;
    grid-template-rows: auto auto auto auto auto;
    gap: 12px;
    padding: 14px;
    max-width: 1600px;
    margin: 0 auto;
    position: relative; z-index: 1;
  }

  /* ── Panel ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .panel-title {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Score Bar ── */
  .score-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px;
  }
  .score-player {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .score-label {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .score-value {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 600;
    color: var(--gold);
    min-width: 60px;
    text-align: center;
  }
  .score-sep { color: var(--border); font-size: 1.2rem; }

  .turn-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .turn-badge {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .turn-name {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold-light);
  }
  .deck-badge {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-style: italic;
  }

  /* ── Expedition Columns ── */
  .expedition-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .expedition-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: background 0.2s;
    min-height: 58px;
    height: auto;
  }

  .exp-color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .exp-score-label {
    font-family: 'Cinzel', serif;
    font-size: 0.62rem;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin-left: auto;
    white-space: nowrap;
  }

  .exp-cards {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    flex: 1;
  }

  /* ── Cards ── */
  .card {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 40px;
    border-radius: 5px;
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: default;
    position: relative;
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.1);
    user-select: none;
  }
  .card.mini { width: 32px; height: 44px; font-size: 0.85rem; }
  .hand-card {
    width: 48px; height: 68px;
    font-size: 1.1rem;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .hand-card:hover { transform: translateY(-8px) scale(1.05); box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
  .hand-card.selected {
    transform: translateY(-14px) scale(1.08);
    box-shadow: 0 16px 32px rgba(0,0,0,0.6), 0 0 0 2px var(--gold);
  }

  .color-Blue   { background: linear-gradient(135deg, var(--Blue-dark), var(--Blue)); color: #fff; }
  .color-Yellow { background: linear-gradient(135deg, var(--Yellow-dark), var(--Yellow)); color: #fff; }
  .color-White  { background: linear-gradient(135deg, #334155, #64748b); color: #fff; }
  .color-Green  { background: linear-gradient(135deg, var(--Green-dark), var(--Green)); color: #fff; }
  .color-Red    { background: linear-gradient(135deg, var(--Red-dark), var(--Red)); color: #fff; }

  /* wager X badge */
  .card[data-value="0"]::after,
  .hand-card[data-value="0"]::after {
    content: '✕';
    font-size: 0.6em;
    opacity: 0.6;
    position: absolute;
    bottom: 2px;
    right: 3px;
  }

  /* ── Center Board ── */
  .center-board {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .discard-area {
  }

  .discard-grid {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .discard-pile {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px;
    position: relative;
  }
  .discard-pile:hover { border-color: var(--gold); background: var(--surface-hover); }
  .discard-pile.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), inset 0 0 12px rgba(201,168,76,0.1); }
  .discard-pile.empty { opacity: 0.4; cursor: not-allowed; }
  .discard-pile.empty:hover { border-color: var(--border); background: var(--surface2); }
  .discard-label {
    font-size: 0.6rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .discard-count {
    font-size: 0.65rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .deck-pile {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .deck-pile:hover { border-color: var(--gold); background: var(--surface-hover); }
  .deck-pile.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), inset 0 0 12px rgba(201,168,76,0.1); }
  .deck-count {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    color: var(--gold);
    font-weight: 600;
  }
  .deck-text {
    font-size: 0.6rem;
    font-family: 'Cinzel', serif;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  /* ── Player Hand ── */
  .hand-area {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }

  .hand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .hand-cards {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    min-height: 80px;
    align-items: flex-end;
    justify-content: center;
    padding-top: 16px;
  }

  /* ── Action Bar ── */
  .action-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .action-hint {
    font-style: italic;
    color: var(--text-muted);
    font-size: 0.9rem;
    flex: 1;
  }

  .btn {
    font-family: 'Cinzel', serif;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.18s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
  .btn-expedition {
    background: linear-gradient(135deg, #14532d, #16a34a);
    color: #fff;
    border: 1px solid #22c55e;
  }
  .btn-expedition:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(22,163,74,0.4); }
  .btn-discard-play {
    background: linear-gradient(135deg, #7f1d1d, #dc2626);
    color: #fff;
    border: 1px solid #ef4444;
  }
  .btn-discard-play:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(220,38,38,0.4); }
  .btn-reset {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-reset:hover { color: var(--text); border-color: var(--text-muted); }

  /* ── Message Toast ── */
  #message-toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.95rem;
    font-style: italic;
    padding: 10px 22px;
    border-radius: 30px;
    z-index: 100;
    transition: transform 0.3s ease, opacity 0.3s;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    max-width: 90vw;
  }
  #message-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  #message-toast.error { border-color: #dc2626; color: #fca5a5; }
  #message-toast.success { border-color: #16a34a; color: #86efac; }

  /* ── Opponent select ── */
  .opponent-bar {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    flex-wrap: wrap;
  }
  .opponent-bar label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .opponent-bar select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: 'Crimson Text', serif;
    font-size: 0.95rem;
    flex: 1;
    min-width: 160px;
    cursor: pointer;
  }
  .opponent-bar select:focus { outline: none; border-color: var(--gold); }

  /* ── Game over overlay ── */
  #gameover-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(12,10,14,0.85);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #gameover-overlay.show { display: flex; }
  .gameover-card {
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: 16px;
    padding: 40px 50px;
    text-align: center;
    box-shadow: 0 0 60px rgba(201,168,76,0.2);
    animation: popIn 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .gameover-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 2rem;
    color: var(--gold);
    margin-bottom: 12px;
  }
  .gameover-scores {
    display: flex;
    gap: 30px;
    justify-content: center;
    margin: 20px 0;
  }
  .gameover-score { font-family: 'Cinzel', serif; }
  .gameover-score .name { font-size: 0.8rem; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .gameover-score .val { font-size: 2.2rem; color: var(--gold-light); font-weight: 600; }
  .gameover-winner { font-size: 1.1rem; color: var(--text-muted); font-style: italic; margin-bottom: 20px; }

  /* AI thinking indicator */
  .thinking-bar {
    grid-column: 1 / -1;
    text-align: center;
    padding: 8px;
    color: var(--text-muted);
    font-style: italic;
    font-size: 0.9rem;
    animation: pulse 1.5s infinite;
    visibility: hidden;
    opacity: 0;
  }
  .thinking-bar.show { visibility: visible; opacity: 1; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* Responsive */
  @media (max-width: 900px) {
    .game-layout { grid-template-columns: 1fr; }
    .center-board { grid-column: 1; }
    .score-bar, .opponent-bar, .hand-area, .thinking-bar { grid-column: 1; }
  }
</style>
</head>
<body>

<header style="position:relative">
  <h1>Lost Cities</h1>
  <p>An expedition into the unknown</p>
  <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark mode">🌙</button>
</header>

<div class="game-layout">

  <!-- Score bar -->
  <div class="score-bar">
    <div class="score-player">
      <div>
        <div class="score-label">You</div>
        <div class="score-value" id="score-p0">0</div>
      </div>
    </div>
    <div class="turn-indicator">
      <span class="turn-badge">Turn</span>
      <span class="turn-name" id="turn-name">—</span>
      <span class="deck-badge"><span id="deck-size">44</span> cards remain</span>
    </div>
    <div class="score-player">
      <div style="text-align:right">
        <div class="score-label">Opponent</div>
        <div class="score-value" id="score-p1">0</div>
      </div>
    </div>
  </div>

  <!-- Thinking bar -->
  <div class="thinking-bar" id="thinking-bar">⏳ Opponent is thinking…</div>

  <!-- Player 1 (Opponent) Expeditions -->
  <div class="panel">
    <div class="panel-title">Opponent Expeditions</div>
    <div class="expedition-panel" id="exp-p1"></div>
  </div>

  <!-- Center: discard piles (vertical) -->
  <div class="center-board">
    <div class="panel discard-area">
      <div class="panel-title">Discard — click to draw</div>
      <div class="discard-grid" id="discard-grid"></div>
      <!-- Deck inline at bottom -->
      <div class="deck-pile" id="deck-btn" onclick="selectDrawSource(0)" style="margin-top:6px">
        <div class="deck-count" id="deck-count">44</div>
        <div class="deck-text">Draw Deck</div>
      </div>
    </div>
  </div>

  <!-- Player 0 (Human) Expeditions -->
  <div class="panel">
    <div class="panel-title">Your Expeditions</div>
    <div class="expedition-panel" id="exp-p0"></div>
  </div>

  <!-- Opponent select -->
  <div class="opponent-bar">
    <label>Run:</label>
    <select id="run-select" onchange="onRunChanged()">
      <option value="" disabled selected>Select run…</option>
    </select>
    <label>Checkpoint:</label>
    <select id="checkpoint-select">
      <option value="" disabled selected>Select checkpoint…</option>
    </select>
    <button class="btn btn-reset" onclick="setOpponentAndReset()">Set &amp; Restart</button>
    <label>Goes first:</label>
    <select id="starting-player" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:Crimson Text,serif;font-size:0.95rem;cursor:pointer">
      <option value="0">You</option>
    </select>
    <button class="btn btn-reset" onclick="resetGame()">↺ New Game</button>
    <button class="btn btn-reset" onclick="startAutoplay()" id="autoplay-btn">▶ Autoplay</button>
    <label>Speed:</label>
    <select id="autoplay-speed" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-family:Crimson Text,serif;font-size:0.95rem;cursor:pointer">
      <option value="1000">Slow</option>
      <option value="500" selected>Medium</option>
      <option value="200">Fast</option>
      <option value="50">Instant</option>
    </select>
  </div>

  <!-- Hand area -->
  <div class="hand-area">
    <div class="hand-header">
      <div class="panel-title" style="border:none;margin:0;padding:0">Your Hand</div>
      <div id="selection-hint" style="font-style:italic;font-size:0.85rem;color:var(--text-muted)">Select a card</div>
    </div>
    <div class="hand-cards" id="player-hand"></div>
    <div class="action-bar">
      <div class="action-hint" id="action-hint">Pick a card from your hand.</div>
      <button class="btn btn-expedition" id="btn-expedition" disabled onclick="chooseAction('E')">▲ Play to Expedition</button>
      <button class="btn btn-discard-play" id="btn-discard" disabled onclick="chooseAction('D')">▼ Discard Card</button>
      <button class="btn btn-reset" id="btn-cancel" style="display:none" onclick="cancelAction()">✕ Cancel</button>
    </div>
  </div>

</div>

<!-- Game over overlay -->
<div id="gameover-overlay">
  <div class="gameover-card">
    <h2>Expedition Complete</h2>
    <div class="gameover-scores">
      <div class="gameover-score">
        <div class="name">You</div>
        <div class="val" id="go-score-p0">0</div>
      </div>
      <div class="gameover-score">
        <div class="name">Opponent</div>
        <div class="val" id="go-score-p1">0</div>
      </div>
    </div>
    <div class="gameover-winner" id="go-winner"></div>
    <button class="btn btn-expedition" onclick="resetGame(); document.getElementById('gameover-overlay').classList.remove('show')">Play Again</button>
  </div>
</div>

<!-- Toast -->
<div id="message-toast"></div>

<script>
const API_BASE_URL = "";

// ── Theme ───────────────────────────────────────────────────────────────────
function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}
(function () {
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
})();
const COLORS = ["Blue","Yellow","White","Green","Red"];
const COLOR_VARS = { Blue:"#2563eb", Yellow:"#d97706", White:"#64748b", Green:"#16a34a", Red:"#dc2626" };

let selectedCardIndex = null;
let selectedDrawSource = null;
let gameData = null;
let opponentsLoaded = false;

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type='') {
  const t = document.getElementById('message-toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 3500);
}

// ── Card HTML ──────────────────────────────────────────────────────────────
function makeCard(card, cls='') {
  if (!card) return '';
  const [ci, v] = card;
  const cn = COLORS[ci];
  const label = v === 0 ? 'X' : v;
  return `<span class="card mini color-${cn}" data-value="${v}" title="${cn} ${v===0?'Wager':v}">${label}</span>`;
}

// ── Expedition score helper ────────────────────────────────────────────────
function calcExpScore(cards) {
  if (!cards || cards.length === 0) return 0;
  let wagers = 0, sum = 0;
  cards.forEach(([, v]) => { if (v === 0) wagers++; else sum += v; });
  let score = (sum - 20) * (wagers + 1);
  if (cards.length >= 8) score += 20;
  return score;
}

// ── Render expeditions ─────────────────────────────────────────────────────
// containerId: DOM element id ('exp-p0' = your panel, 'exp-p1' = opponent panel)
// dataIndex:   index into state.expeditions[] that holds this player's cards
//              The server always returns expeditions[0] = human (player 0),
//              expeditions[1] = AI (player 1), regardless of who requested.
function renderExpeditionsIntoPanel(containerId, dataIndex, expeditions) {
  const container = document.getElementById(containerId);
  const exps = expeditions[dataIndex];
  if (!exps) return;
  const frag = document.createDocumentFragment();
  COLORS.forEach((colorName, ci) => {
    const cards = exps[ci] || [];
    const score = calcExpScore(cards);
    const row = document.createElement('div');
    row.className = 'expedition-row';
    const dot = `<span class="exp-color-dot" style="background:${COLOR_VARS[colorName]}"></span>`;
    const cardsHtml = cards.length
      ? `<div class="exp-cards">${cards.map(c => makeCard(c)).join('')}</div>`
      : `<div class="exp-cards" style="color:var(--text-muted);font-size:0.7rem;font-style:italic">—</div>`;
    const scoreEl = cards.length
      ? `<span class="exp-score-label" style="color:${score>=0?'#86efac':'#fca5a5'}">${score>0?'+':''}${score}</span>`
      : '';
    row.innerHTML = dot + cardsHtml + scoreEl;
    frag.appendChild(row);
  });
  container.replaceChildren(frag);
}

// ── Render discard piles ───────────────────────────────────────────────────
function renderDiscardPiles(state) {
  const grid = document.getElementById('discard-grid');
  const frag = document.createDocumentFragment();
  COLORS.forEach((colorName, ci) => {
    const topCard = state.discard_piles[ci];
    const count = (state.full_discard_piles && state.full_discard_piles[ci]) ? state.full_discard_piles[ci].length : 0;
    const isEmpty = count === 0;
    const pile = document.createElement('div');
    pile.className = 'discard-pile' + (isEmpty ? ' empty' : '');
    pile.dataset.source = ci + 1;
    pile.innerHTML = `
      <div class="discard-label" style="color:${COLOR_VARS[colorName]}">${colorName}</div>
      ${topCard ? makeCard(topCard) : '<span style="color:var(--text-muted);font-size:1.2rem">∅</span>'}
      <div class="discard-count">${count > 0 ? count + ' cards' : 'empty'}</div>`;
    if (!isEmpty) {
      pile.onclick = () => selectDrawSource(ci + 1);
    }
    frag.appendChild(pile);
  });
  grid.replaceChildren(frag);
  if (selectedDrawSource !== null) highlightDrawSource(selectedDrawSource);
}

// ── Render hand ────────────────────────────────────────────────────────────
function renderHand(hand) {
  const container = document.getElementById('player-hand');
  const frag = document.createDocumentFragment();
  hand.forEach((card, idx) => {
    const [ci, v] = card;
    const cn = COLORS[ci];
    const label = v === 0 ? 'X' : v;
    const span = document.createElement('span');
    span.className = `card hand-card color-${cn}`;
    span.textContent = label;
    span.dataset.index = idx;
    span.dataset.value = v;
    span.dataset.color = ci;
    span.title = `${cn} ${v === 0 ? 'Wager' : v}`;
    span.onclick = () => selectCard(idx);
    frag.appendChild(span);
  });
  container.replaceChildren(frag);
  if (selectedCardIndex !== null && selectedCardIndex < hand.length) {
    highlightCard(selectedCardIndex);
  } else {
    selectedCardIndex = null;
  }
  updateUI();
}

// ── Update score bar & turn ────────────────────────────────────────────────
function updateScoreBar(state) {
  document.getElementById('score-p0').textContent = Math.round(state.scores[0]);
  document.getElementById('score-p1').textContent = Math.round(state.scores[1]);
  document.getElementById('deck-size').textContent = state.deck_size;
  document.getElementById('deck-count').textContent = state.deck_size;
  const isYourTurn = state.current_player === 0;
  document.getElementById('turn-name').textContent = isYourTurn ? 'Your Turn' : 'Opponent…';
  document.getElementById('turn-name').style.color = isYourTurn ? 'var(--gold-light)' : 'var(--text-muted)';
}

// ── 3-step turn state machine ─────────────────────────────────────────────
// step 1: select card from hand
// step 2: choose action (E=expedition / D=discard) via buttons
// step 3: click draw source (deck or discard pile) → auto-submits
let pendingActionType = null; // 'E' or 'D', set in step 2

function resetTurnState() {
  selectedCardIndex = null;
  selectedDrawSource = null;
  pendingActionType = null;
  highlightCard(-1);
  highlightDrawSource(-1);
  setDrawSourcesClickable(false);
}

// Make deck + discard piles clickable or not for draw-picking step
function setDrawSourcesClickable(enabled) {
  document.getElementById('deck-btn').style.outline = enabled ? '2px dashed var(--gold)' : '';
  document.querySelectorAll('.discard-pile:not(.empty)').forEach(el => {
    el.style.outline = enabled ? '2px dashed var(--gold)' : '';
  });
}

function highlightCard(idx) {
  document.querySelectorAll('.hand-card').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.index) === idx);
  });
}
function highlightDrawSource(src) {
  document.querySelectorAll('.discard-pile').forEach(el => {
    el.classList.toggle('selected', parseInt(el.dataset.source) === src);
  });
  const deck = document.getElementById('deck-btn');
  if (deck) deck.classList.toggle('selected', src === 0);
}

// Step 1: player clicks a card
function selectCard(idx) {
  if (!gameData || gameData.current_player !== 0 || gameData.game_over) return;
  // If already waiting for draw source, clicking a different card restarts from step 1
  selectedCardIndex = idx;
  selectedDrawSource = null;
  pendingActionType = null;
  highlightCard(idx);
  setDrawSourcesClickable(false);
  updateUI();
}

// Step 2: player clicks Play or Discard button
function chooseAction(actionType) {
  if (selectedCardIndex === null) { showToast('Select a card first.', 'error'); return; }
  pendingActionType = actionType;
  setDrawSourcesClickable(true);
  updateUI();
}

// Cancel step 2 — go back to step 1 (card still selected, action cleared)
function cancelAction() {
  pendingActionType = null;
  selectedDrawSource = null;
  setDrawSourcesClickable(false);
  updateUI();
}

// Step 3: player clicks a draw source — auto-submits
function selectDrawSource(src) {
  if (pendingActionType === null) {
    // Step 2 not done yet — just store for legacy compat but prompt correctly
    showToast('Choose Play or Discard first.', 'error');
    return;
  }
  selectedDrawSource = src;
  highlightDrawSource(src);
  setDrawSourcesClickable(false);
  // Auto-submit immediately
  submitAction(pendingActionType);
}

function updateUI() {
  const yourTurn = gameData && gameData.current_player === 0 && !gameData.game_over;
  // Action buttons enabled only after card is selected and we're in step 2
  const cardSelected = selectedCardIndex !== null;
  document.getElementById('btn-expedition').disabled = !(cardSelected && yourTurn && pendingActionType === null);
  document.getElementById('btn-discard').disabled    = !(cardSelected && yourTurn && pendingActionType === null);

  // Hint text guides through the 3 steps
  let hint = '';
  if (!yourTurn && gameData && !gameData.game_over) {
    hint = 'Waiting for opponent…';
  } else if (!cardSelected) {
    hint = 'Step 1 — Click a card from your hand.';
  } else if (pendingActionType === null) {
    hint = 'Step 2 — Play it to your expedition, or discard it.';
  } else {
    const actionLabel = pendingActionType === 'E' ? 'expedition' : 'discard';
    hint = `Step 3 — Choose where to draw from (deck or a discard pile). Card will go to ${actionLabel}.`;
  }
  document.getElementById('action-hint').textContent = hint;

  const cardInfo = (gameData && cardSelected && gameData.hand && gameData.hand[selectedCardIndex])
    ? (() => { const [ci,v] = gameData.hand[selectedCardIndex]; return `${COLORS[ci]} ${v===0?'Wager':v}`; })()
    : '—';
  const actionInfo = pendingActionType === null ? '—' : pendingActionType === 'E' ? 'Expedition' : 'Discard';
  document.getElementById('selection-hint').textContent =
    cardSelected ? `Card: ${cardInfo} · Action: ${actionInfo}` : 'Select a card';

  // Cancel button only visible in step 3 (action chosen, awaiting draw source)
  document.getElementById('btn-cancel').style.display = (pendingActionType !== null) ? '' : 'none';
}

// ── Full render ────────────────────────────────────────────────────────────
function renderGame(state) {
  // expeditions[0] is ALWAYS the human (player 0), expeditions[1] is always the AI.
  // exp-p0 DOM panel = "Your Expeditions", exp-p1 DOM panel = "Opponent Expeditions".
  // These two facts are decoupled so flipping starting player doesn't break display.
  renderExpeditionsIntoPanel('exp-p0', 0, state.expeditions);
  renderExpeditionsIntoPanel('exp-p1', 1, state.expeditions);
  renderDiscardPiles(state);
  updateScoreBar(state);
  if (state.hand) renderHand(state.hand);
  updateUI();
  if (state.game_over) showGameOver(state);
}

function showGameOver(state) {
  document.getElementById('go-score-p0').textContent = Math.round(state.scores[0]);
  document.getElementById('go-score-p1').textContent = Math.round(state.scores[1]);
  const s0 = state.scores[0], s1 = state.scores[1];
  const winner = s0 > s1 ? 'You win! 🏆' : s0 < s1 ? 'Opponent wins.' : "It's a draw!";
  document.getElementById('go-winner').textContent = winner;
  document.getElementById('gameover-overlay').classList.add('show');
}

// ── API calls ──────────────────────────────────────────────────────────────
async function loadGameState() {
  try {
    const res = await fetch(`${API_BASE_URL}/game/state/0`);
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    gameData = await res.json();
    renderGame(gameData);
    // If AI goes first (current_player=1 on load), trigger its move via a dummy poll
    if (gameData.current_player === 1 && !gameData.game_over) {
      awaitAITurn();
    }
  } catch(e) {
    showToast(`Cannot connect to server: ${e.message}`, 'error');
  }
}

// Called when AI needs to take its turn (e.g. AI goes first at game start).
// Polls /game/state until current_player flips back to 0.
async function awaitAITurn() {
  document.getElementById('thinking-bar').classList.add('show');
  // The server runs AI moves synchronously inside env.step — but the AI's first move
  // on game start isn't triggered until we hit /game/play. Instead we just poll state.
  let attempts = 0;
  const poll = async () => {
    try {
      const res = await fetch(`${API_BASE_URL}/game/state/0`);
      const state = await res.json();
      if (state.current_player === 0 || state.game_over || attempts > 20) {
        gameData = state;
        renderGame(gameData);
        document.getElementById('thinking-bar').classList.remove('show');
      } else {
        attempts++;
        setTimeout(poll, 800);
      }
    } catch(e) {
      document.getElementById('thinking-bar').classList.remove('show');
    }
  };
  setTimeout(poll, 600);
}

async function submitAction(actionType) {
  // Called automatically from selectDrawSource (step 3) — all three values are set.
  if (selectedCardIndex === null || selectedDrawSource === null || !actionType) return;
  if (gameData.game_over || gameData.current_player !== 0) return;

  const payload = {
    player_id: 0,
    card_index: selectedCardIndex,
    action_type: actionType,
    draw_source: selectedDrawSource
  };

  document.getElementById('thinking-bar').classList.add('show');
  document.getElementById('btn-expedition').disabled = true;
  document.getElementById('btn-discard').disabled = true;

  try {
    const res = await fetch(`${API_BASE_URL}/game/play`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.detail || 'Invalid move.', 'error'); resetTurnState(); return; }

    showToast(data.message || 'Move played.', 'success');
    gameData = data.state;
    resetTurnState();
    renderGame(gameData);
  } catch(e) {
    showToast(`Network error: ${e.message}`, 'error');
    resetTurnState();
  } finally {
    document.getElementById('thinking-bar').classList.remove('show');
  }
}

async function resetGame(startingPlayer) {
  try {
    // Pass starting_player param so backend can randomise or set who goes first
    const sp = startingPlayer !== undefined ? startingPlayer : parseInt(document.getElementById('starting-player').value);
    await fetch(`${API_BASE_URL}/game/reset?starting_player=${sp}`);
    resetTurnState();
    document.getElementById('gameover-overlay').classList.remove('show');
    await loadGameState();
    showToast('New expedition begun.', 'success');
  } catch(e) {
    showToast(`Reset failed: ${e.message}`, 'error');
  }
}

// ── Opponent select (two-dropdown: run + checkpoint) ──────────────────────
const STORAGE_KEY_RUN = 'lostcities_run';
const STORAGE_KEY_CKPT = 'lostcities_ckpt';
let allRuns = [];

async function loadOpponents() {
  const runSel = document.getElementById('run-select');
  const ckptSel = document.getElementById('checkpoint-select');
  runSel.innerHTML = '<option disabled selected>Loading…</option>';
  ckptSel.innerHTML = '<option disabled selected>—</option>';
  try {
    const res = await fetch(`${API_BASE_URL}/game/opponent`);
    const data = await res.json();
    allRuns = data.runs || [];
    runSel.innerHTML = '';
    allRuns.forEach((r, i) => {
      const o = document.createElement('option');
      o.value = i; o.textContent = r.name;
      runSel.appendChild(o);
    });
    opponentsLoaded = true;

    // Restore saved selection
    const savedRun = localStorage.getItem(STORAGE_KEY_RUN);
    const savedCkpt = localStorage.getItem(STORAGE_KEY_CKPT);
    let selectedRun = null;
    if (savedRun) {
      const idx = allRuns.findIndex(r => r.name === savedRun);
      if (idx >= 0) { runSel.value = idx; onRunChanged(); selectedRun = allRuns[idx]; }
    }
    if (!selectedRun && allRuns.length > 0) {
      runSel.value = 0;
      onRunChanged();
      selectedRun = allRuns[0];
    }
    // Restore checkpoint within run
    if (savedCkpt && selectedRun) {
      const match = selectedRun.checkpoints.find(c => c.name === savedCkpt);
      if (match) { ckptSel.value = match.id; }
    }
    // Return current selection for auto-apply
    const ckptId = ckptSel.value;
    if (ckptId && selectedRun) {
      const ckpt = selectedRun.checkpoints.find(c => c.id === ckptId);
      return ckpt || null;
    }
    return null;
  } catch(e) {
    runSel.innerHTML = '<option disabled>Failed to load</option>';
    showToast('Could not load opponent list.', 'error');
    return null;
  }
}

function onRunChanged() {
  const runSel = document.getElementById('run-select');
  const ckptSel = document.getElementById('checkpoint-select');
  const runIdx = parseInt(runSel.value);
  if (isNaN(runIdx) || !allRuns[runIdx]) return;
  const run = allRuns[runIdx];
  ckptSel.innerHTML = '';
  // Default to latest checkpoint (last in sorted list)
  run.checkpoints.forEach(c => {
    const o = document.createElement('option');
    o.value = c.id; o.textContent = c.name;
    ckptSel.appendChild(o);
  });
  // Select the latest (last) by default
  if (run.checkpoints.length > 0) {
    ckptSel.value = run.checkpoints[run.checkpoints.length - 1].id;
  }
}

async function applyOpponent(ckpt) {
  try {
    const res = await fetch(`${API_BASE_URL}/game/set_opponent`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: ckpt.id })
    });
    if (!res.ok) {
      const d = await res.json();
      showToast(d.detail || 'Failed to set opponent.', 'error');
      return false;
    }
    return true;
  } catch(e) {
    showToast(`Network error: ${e.message}`, 'error');
    return false;
  }
}

async function setOpponentAndReset() {
  const runSel = document.getElementById('run-select');
  const ckptSel = document.getElementById('checkpoint-select');
  const runIdx = parseInt(runSel.value);
  const ckptId = ckptSel.value;
  if (isNaN(runIdx) || !allRuns[runIdx]) { showToast('Please select a run first.', 'error'); return; }
  if (!ckptId) { showToast('Please select a checkpoint first.', 'error'); return; }
  const run = allRuns[runIdx];
  const ckpt = run.checkpoints.find(c => c.id === ckptId);
  if (!ckpt) { showToast('Checkpoint not found.', 'error'); return; }
  const ok = await applyOpponent(ckpt);
  if (!ok) return;
  localStorage.setItem(STORAGE_KEY_RUN, run.name);
  localStorage.setItem(STORAGE_KEY_CKPT, ckpt.name);
  showToast(`Opponent: ${run.name} / ${ckpt.name}. New game…`, 'success');
  await resetGame();
}

// ── Autoplay ──────────────────────────────────────────────────────────────
let autoplayData = null;
let autoplayIdx = 0;
let autoplayTimer = null;

async function startAutoplay() {
  const btn = document.getElementById('autoplay-btn');
  // If already running, stop
  if (autoplayTimer) { stopAutoplay(); return; }
  btn.textContent = '⏹ Stop';
  try {
    showToast('Running AI vs AI game...', 'success');
    const res = await fetch(`${API_BASE_URL}/game/autoplay`);
    if (!res.ok) { const d = await res.json(); showToast(d.detail || 'Autoplay failed.', 'error'); stopAutoplay(); return; }
    const data = await res.json();
    autoplayData = data.steps;
    autoplayIdx = 0;
    stepAutoplay();
  } catch(e) {
    showToast(`Autoplay error: ${e.message}`, 'error');
    stopAutoplay();
  }
}

function stepAutoplay() {
  if (!autoplayData || autoplayIdx >= autoplayData.length) { stopAutoplay(); return; }
  const state = autoplayData[autoplayIdx];
  gameData = state;
  renderGame(gameData);
  // Show action description
  if (state.last_action) {
    const a = state.last_action;
    const COLOR_NAMES = ['Blue','Yellow','White','Green','Red'];
    const cardStr = a.card[1] === 0 ? `${COLOR_NAMES[a.card[0]]} Inv` : `${COLOR_NAMES[a.card[0]]} ${a.card[1]}`;
    showToast(`P${a.player}: ${a.action} ${cardStr}, draw ${a.draw}`, 'success');
  }
  autoplayIdx++;
  if (autoplayIdx < autoplayData.length) {
    const speed = parseInt(document.getElementById('autoplay-speed').value);
    autoplayTimer = setTimeout(stepAutoplay, speed);
  } else {
    stopAutoplay();
    showToast('Autoplay complete.', 'success');
  }
}

function stopAutoplay() {
  if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; }
  autoplayData = null;
  autoplayIdx = 0;
  document.getElementById('autoplay-btn').textContent = '▶ Autoplay';
}

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
  const ckpt = await loadOpponents();
  if (ckpt) {
    const ok = await applyOpponent(ckpt);
    if (ok) await resetGame();
  } else {
    await loadGameState();
  }
});
</script>
